intrinsic_valuation_analysis:
  description: >
    Calculate the intrinsic value of {company_stock} using fundamental valuation techniques, including
    discounted cash flow (DCF), earnings-based, and asset-based models. Assess if the stock is overvalued
    or undervalued relative to its true worth.
    *Be straightforward. If the company is overvalued or undervalued, state it clearly without hesitation. People trust your honest opinion.*
  expected_output: >
    A comprehensive report detailing the intrinsic value of {company_stock}, the methodologies used,
    key assumptions, and a valuation assessment (overvalued, undervalued, or fairly valued).
    *Deliver a candid and transparent evaluation of the stock’s true worth, taking into account potential weaknesses in the models and assumptions.*

relative_valuation_analysis:
  description: >
    Compare {company_stock} with its peer group using relative valuation metrics such as Price-to-Earnings (P/E),
    Price-to-Book (P/B), and EV/EBITDA ratios. Highlight differences in valuation and determine
    how {company_stock} ranks against its competitors.
    *Don’t shy away from pointing out if {company_stock} is mispriced compared to its peers. A fair comparison can highlight critical opportunities and risks.*
  expected_output: >
    A detailed report comparing {company_stock} to its peers, with insights on its relative valuation and
    industry positioning based on the analyzed metrics.
    *Give a realistic perspective on where {company_stock} stands in the market compared to its competitors. If it’s over or undervalued, say so.*

growth_potential_analysis:
  description: >
    Analyze the growth potential of {company_stock} by examining historical revenue trends, market dynamics,
    and strategic initiatives. Evaluate the company’s ability to capitalize on future growth opportunities.
    *Provide an honest analysis of growth prospects. If the future looks uncertain, don’t sugarcoat it; your analysis should be based on what’s realistically possible.*
  expected_output: >
    A structured report outlining {company_stock}'s historical growth performance, market opportunities,
    and strategic initiatives, with an assessment of its overall growth potential.
    *Offer an unflinching review of growth opportunities, including any weaknesses or missed opportunities that could limit future success.*

valuation_summary:
  description: >
    Combine insights from intrinsic, relative, and growth potential analyses to provide a comprehensive
    valuation summary for {company_stock}. Weigh the findings from each analysis and deliver actionable
    conclusions on the company's valuation.
    *Make sure the final valuation summary doesn’t gloss over any major concerns. Your conclusion should be clear, honest, and reflect all the insights gathered.*
  expected_output: >
    A concise yet detailed report synthesizing all valuation insights for {company_stock}. Include the final
    valuation assessment, major findings, and an investment recommendation, formatted in a clear
    and visually appealing way.
    *Provide an honest summary, drawing conclusions from all angles—whether optimistic or cautious—so investors have a complete picture of the company’s value.*
