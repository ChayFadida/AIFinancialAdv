financial_analysis:
  description: >
    Conduct a thorough analysis of {company_stock}'s stock financial health and market performance. This includes examining key financial metrics such as
    P/E ratio, EPS growth, revenue trends, and debt-to-equity ratio. Also, analyze the stock's performance in comparison 
    to its industry peers and overall market trends.

  expected_output: >
    The final report must expand on the summary provided but now 
    including a clear assessment of the stock's financial standing, its strengths and weaknesses, 
    and how it fares against its competitors in the current market scenario.
    Make sure to use the most recent data possible.

research:
  description: >
    Collect and summarize recent news articles, press
    releases, and market analyses related to the {company_stock} stock and its industry.
    Pay special attention to any significant events, market sentiments, and analysts' opinions. 
    Also include upcoming events like earnings and others.

  expected_output: >
    A report that includes a comprehensive summary of the latest news, 
    any notable shifts in market sentiment, and potential impacts on the stock. Also make sure to return the stock ticker as {company_stock}.
    Make sure to use the most recent data as possible.

filings_analysis:
  description: >
    Analyze the latest 10-Q and 10-K filings from EDGAR for the stock {company_stock} in question. 
    Focus on key sections like Management's Discussion and analysis, financial statements, insider trading activity, 
    and any disclosed risks. Extract relevant data and insights that could influence
    the stock's future performance.

  expected_output: >
    Final answer must be an expanded report that now also highlights significant findings
    from these filings including any red flags or positive indicators for your customer.

recommend:
  description: >
    Review and synthesize the analyses provided by the
    Financial Analyst and the Research Analyst.
    Combine these insights to form a comprehensive
    investment recommendation. You MUST Consider all aspects, including financial
    health, market sentiment, and qualitative data from
    EDGAR filings. 
    
    Make sure to include a section that shows insider 
    trading activity, and upcoming events like earnings.

  expected_output: > 
    Your final answer MUST be a recommendation for your customer. It should be a full super detailed report, providing a 
    clear investment stance and strategy with supporting evidence.
    Make it pretty and well formatted for your customer.

market_sentiment_analysis:
  description: >
    Analyze recent news, social media trends, and analyst reports to determine the sentiment around the {company_stock} stock. 
    Highlight any significant sentiment shifts and their potential impact on the stock's performance.

  expected_output: >
    A summary report detailing the current market sentiment, including key drivers of sentiment shifts,
    and their potential implications for the stock's short-term and long-term performance.

financial_risk_analysis:
  description: >
    Assess the financial risks associated with {company_stock}, including liquidity risks, solvency risks, 
    and creditworthiness. Analyze financial ratios and statements to identify potential red flags.

  expected_output: >
    A detailed financial risk report identifying key risk factors, red flags, and their potential 
    impact on the stock's performance.

sector_risk_analysis:
  description: >
    Evaluate risks specific to the sector {company_stock} belongs to, and compare its performance with key competitors. 
    Focus on industry trends, competitive positioning, and external risks such as supply chain disruptions.

  expected_output: >
    A report summarizing the sector's risk factors, {company_stock}'s position within the sector, and any relevant 
    comparisons to its competitors.

macroeconomic_risk_analysis:
  description: >
    Analyze broader macroeconomic factors affecting {company_stock}, including inflation, interest rates, 
    currency fluctuations, and geopolitical events. Assess how these factors could impact the stock's performance.

  expected_output: >
    A report summarizing macroeconomic risks, their potential impacts on {company_stock}, and strategic 
    considerations for mitigating these risks.

regulatory_risk_analysis:
  description: >
    Identify and evaluate regulatory risks associated with {company_stock}, including compliance challenges, 
    potential regulatory changes, and legal risks. Highlight any potential impacts on the stock's performance.

  expected_output: >
    A detailed regulatory risk assessment report highlighting key risks, compliance considerations, and their 
    implications for the stock.

risk_report:
  description: >
    Combine all individual risk assessments and synthesize them into a comprehensive risk report for {company_stock}. 
    Highlight key risks, mitigation strategies, and a holistic risk profile for the stock.

  expected_output: >
    A full risk report detailing the financial, market, sector, macroeconomic, and regulatory risks associated with {company_stock}. 
    The report should be well-formatted, easy to understand, and provide actionable insights for the customer.

risk_summary:
  description: >
    Aggregate the results from the market volatility, sector risk, macroeconomic risk, and geopolitical risk analyses 
    to produce a comprehensive risk summary for investing in {company_stock}.
    Consider the weight and impact of each risk category and how they interact with each other to influence overall investment risk.

  expected_output: >
    Provide a detailed, structured report summarizing all key risks associated with investing in {company_stock}.
    Highlight the most significant risks, their potential impact, and any mitigating factors.
    Include a final risk assessment and recommendation for the customer, formatted in an easily digestible and visually appealing way.

market_expansion_analysis:
  description: >
    Assess and summarize a company's efforts to enter new geographical or sector-specific markets. 
    Focus on how this expansion may impact the company’s revenue growth, market share, and long-term positioning.
    Provide an analysis of market risks, potential challenges, and opportunities in these new markets.
  expected_output: >
    A detailed report outlining the company's expansion plans, including a SWOT analysis (Strengths, Weaknesses, Opportunities, Threats)
    of entering these markets and a forecast of potential financial impact, including revenue growth projections and market share shifts.

product_innovation_impact:
  description: >
    Evaluate the potential impact of upcoming product launches (e.g., new products, services, or technological innovations) on the company's earnings.
    Consider product features, market demand, competition, and consumer interest.
  expected_output: >
    A comprehensive analysis that includes a timeline for product launches, expected market reception, and potential revenue and earnings impact
    from these innovations. Include comparisons with competitors' products, if applicable.

mergers_acquisitions_assessment:
  description: >
    Review any mergers, acquisitions, or strategic partnerships the company is considering. 
    Analyze how these actions could affect the company's long-term growth prospects and market positioning.
  expected_output: >
    An in-depth assessment of the strategic value of potential mergers and acquisitions, including their impact on revenue growth,
    operational efficiency, market presence, and competitive advantage. Provide a risk analysis for each potential M&A deal.

growth_summary:
  description: >
    Aggregate the insights from the market expansion analysis, product innovation impact, and M&A assessment 
    to produce a comprehensive summary of {company_stock}'s growth potential. 
    Evaluate the weight and impact of each growth driver and how they interact with one another to influence 
    {company_stock}'s overall growth trajectory. Highlight opportunities and challenges in the context of current market conditions.
    
  expected_output: >
    Provide a detailed, structured report summarizing all key growth drivers for {company_stock}, 
    including market expansion opportunities, product innovation potential, and the impact of mergers and acquisitions. 
    Highlight the most significant growth opportunities, their expected financial impact, and potential risks. 
    Include a final growth assessment and actionable recommendations for {company_stock}, formatted to be visually appealing 
    and easy to understand for stakeholders.
